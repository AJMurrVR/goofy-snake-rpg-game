<!DOCTYPE html>
<html>
<head>
    <title>Snake RPG: Final Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; touch-action: none; }
        #menu { position: absolute; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; color: white; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; color: white; border-radius: 10px; pointer-events: auto; border: 1px solid #2ecc71; }
        .menu-btn { background: #2ecc71; color: white; border: none; padding: 20px; margin: 10px; cursor: pointer; font-size: 18px; border-radius: 10px; width: 280px; }
        #inventory-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: rgba(20,20,20,0.95); display: none; z-index: 2000; color: white; padding: 20px; border-radius: 15px; border: 2px solid gold; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; pointer-events: auto; }
        .slot { width: 50px; height: 50px; background: rgba(0,0,0,0.7); border: 2px solid #555; margin: 5px; color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #mobile-btns { position: absolute; bottom: 30px; right: 30px; display: flex; pointer-events: auto; }
        .m-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; margin: 10px; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color: #2ecc71;">SNAKE RPG 3D</h1>
        <button class="menu-btn" onclick="initGame('random')">PLAY RANDOM WORLD</button>
        <button class="menu-btn" onclick="initGame('editor')" style="background:#3498db">CREATE MAP (EDITOR)</button>
    </div>

    <div id="hud">
        <div id="stats">
            HP: <span id="hp-val">100</span> | Gold: <span id="gold-val">0</span><br>
            Length: <span id="len-val">1</span>
        </div>
        <div id="hotbar">
            <div class="slot">Sword</div><div class="slot">Apple</div><div class="slot">Block</div>
        </div>
        <div id="mobile-btns">
            <div class="m-btn" ontouchstart="jump()">JUMP</div>
            <div class="m-btn" ontouchstart="attack()" style="background:red">ATK</div>
            <div class="m-btn" ontouchstart="toggleInv()">INV</div>
        </div>
    </div>

    <div id="inventory-screen">
        <h2>INVENTORY</h2>
        <ul id="inv-list">
            <li>Wooden Sword (Equipped)</li>
            <li>Apples: <span id="inv-apples">0</span></li>
            <li>Gold: <span id="inv-gold">0</span></li>
        </ul>
        <button class="menu-btn" style="width:100%; background:#e74c3c" onclick="toggleInv()">CLOSE</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, snakeHead;
        let bodySegments = [], snakeHistory = [];
        let health = 100, gold = 0, apples = 0;
        let isPlaying = false, isEditor = false, isInv = false;
        let vY = 0, isGrounded = true;
        let monsters = [], interactables = [];
        let keys = {};

        window.initGame = (mode) => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            setupBase();
            if(mode === 'random') startRandom(); else startEditor();
            animate();
        };

        function setupBase() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Create Snake Head
            snakeHead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({color: 0x2ecc71}));
            snakeHead.position.y = 1;
            scene.add(snakeHead);
        }

        function startRandom() {
            // Massive Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({color: 0x27ae60}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Spawn Structures (Villages)
            for(let i=0; i<15; i++) {
                let house = new THREE.Mesh(new THREE.BoxGeometry(10, 8, 10), new THREE.MeshStandardMaterial({color: 0x8b4513}));
                house.position.set(Math.random()*800-400, 4, Math.random()*800-400);
                scene.add(house);
            }

            // Spawn Apples
            for(let i=0; i<50; i++) spawnApple();
            
            isPlaying = true;
        }

        function startEditor() {
            isEditor = true;
            isPlaying = true;
            scene.background = new THREE.Color(0x000000);
            scene.add(new THREE.GridHelper(200, 50, 0xffffff, 0x333333));
        }

        function spawnApple() {
            const apple = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({color: 0xff0000}));
            apple.position.set(Math.random()*400-200, 0.5, Math.random()*400-200);
            scene.add(apple);
            interactables.push({mesh: apple, type: 'apple'});
        }

        window.jump = () => { if(isGrounded) vY = 0.3; isGrounded = false; };
        window.attack = () => {
            snakeHead.scale.set(1.5, 1.5, 1.5);
            setTimeout(() => snakeHead.scale.set(1,1,1), 100);
        };
        window.toggleInv = () => {
            isInv = !isInv;
            document.getElementById('inventory-screen').style.display = isInv ? 'block' : 'none';
            document.getElementById('inv-apples').innerText = apples;
            document.getElementById('inv-gold').innerText = gold;
        };

        // Editor Placement
        window.addEventListener('mousedown', (e) => {
            if(!isEditor || isInv) return;
            const ray = new THREE.Raycaster();
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            ray.setFromCamera(mouse, camera);
            const hits = ray.intersectObjects(scene.children);

            if(e.button === 0) { // Left Click Place
                const b = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0x555555}));
                if(hits.length > 0) b.position.copy(hits[0].point).add(hits[0].face.normal);
                else b.position.set(snakeHead.position.x, 1, snakeHead.position.z - 5);
                b.position.x = Math.round(b.position.x / 2) * 2;
                b.position.z = Math.round(b.position.z / 2) * 2;
                b.userData.isBlock = true;
                scene.add(b);
            }
        });

        window.onkeydown = (e) => { 
            keys[e.key.toLowerCase()] = true; 
            if(e.key === 'e') toggleInv();
            if(e.code === 'Space') jump();
        };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function animate() {
            requestAnimationFrame(animate);
            if(isPlaying && !isInv) {
                // Movement
                if(keys['w']) snakeHead.translateZ(-0.3);
                if(keys['s']) snakeHead.translateZ(0.2);
                if(keys['a']) snakeHead.rotation.y += 0.06;
                if(keys['d']) snakeHead.rotation.y -= 0.06;

                // Jump Physics
                snakeHead.position.y += vY;
                vY -= 0.015;
                if(snakeHead.position.y <= 1) { snakeHead.position.y = 1; vY = 0; isGrounded = true; }

                // Snake Body Logic
                snakeHistory.unshift(new THREE.Vector3().copy(snakeHead.position));
                if(snakeHistory.length > 100) snakeHistory.pop();

                for(let i=0; i<bodySegments.length; i++) {
                    const pos = snakeHistory[(i + 1) * 10];
                    if(pos) bodySegments[i].position.lerp(pos, 0.2);
                }

                // Apple Collection
                interactables.forEach((item, idx) => {
                    if(snakeHead.position.distanceTo(item.mesh.position) < 2) {
                        scene.remove(item.mesh);
                        interactables.splice(idx, 1);
                        apples++;
                        growSnake();
                        document.getElementById('len-val').innerText = bodySegments.length + 1;
                    }
                });

                // Camera follow
                const offset = new THREE.Vector3(0, 10, 20).applyMatrix4(snakeHead.matrixWorld);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(snakeHead.position);
            }
            renderer.render(scene, camera);
        }

        function growSnake() {
            const seg = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color: 0x27ae60}));
            seg.position.copy(snakeHead.position);
            scene.add(seg);
            bodySegments.push(seg);
        }
    </script>
</body>
</html>
