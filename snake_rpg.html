<!DOCTYPE html>
<html>
<head>
    <title>Snake RPG: Creator Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        /* Menus */
        .overlay-menu { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; color: white; }
        #pause-menu { display: none; }
        
        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #hp-ui { position: absolute; top: 20px; left: 20px; width: 200px; height: 15px; background: #333; border: 2px solid #fff; pointer-events: auto; }
        #hp-bar { width: 100%; height: 100%; background: #ff4757; }
        
        /* Unity Inspector */
        #inspector { position: absolute; top: 0; right: 0; width: 250px; height: 100%; background: #252525; color: #ddd; padding: 15px; display: none; border-left: 2px solid #111; font-size: 13px; overflow-y: auto; }
        #inspector h3 { color: #2ecc71; margin-top: 0; }
        input, select { width: 100%; background: #111; color: #fff; border: 1px solid #444; margin-bottom: 10px; padding: 5px; }

        .btn { background: #2ecc71; color: white; border: none; padding: 12px; margin: 5px; cursor: pointer; border-radius: 4px; width: 200px; font-weight: bold; }
        .btn-red { background: #e74c3c; }
        .btn-blue { background: #3498db; }
    </style>
</head>
<body>

    <div id="main-menu" class="overlay-menu">
        <h1>SNAKE ENGINE 3D</h1>
        <button class="btn" onclick="initGame('play')">PLAY WORLD</button>
        <button class="btn btn-blue" onclick="initGame('editor')">OPEN EDITOR</button>
    </div>

    <div id="pause-menu" class="overlay-menu">
        <h2>PAUSED</h2>
        <button class="btn" onclick="togglePause()">RESUME</button>
        <button class="btn btn-blue" onclick="saveData()">SAVE GAME</button>
        <button class="btn btn-red" onclick="location.reload()">QUIT TO MENU</button>
    </div>

    <div id="hud">
        <div id="hp-ui"><div id="hp-bar"></div></div>
        <div style="position:absolute; top:45px; left:20px; color:white;">Gold: <span id="gold-txt">0</span></div>
    </div>

    <div id="inspector">
        <h3>Hierarchy & Inspector</h3>
        <hr>
        <h4>Spawn New</h4>
        <select id="spawn-type">
            <option value="block">Basic Block</option>
            <option value="apple">Apple Fruit</option>
            <option value="trader">Mod Trader</option>
            <option value="boss">Castle Boss</option>
        </select>
        <button class="btn btn-blue" style="width:100%" onclick="spawnInEditor()">Spawn at Camera</button>
        
        <hr>
        <h4>Transform</h4>
        <label>PosX</label><input type="number" id="ix" step="0.5" oninput="applyTransform()">
        <label>PosY</label><input type="number" id="iy" step="0.5" oninput="applyTransform()">
        <label>PosZ</label><input type="number" id="iz" step="0.5" oninput="applyTransform()">
        <button class="btn btn-red" style="width:100%" onclick="deleteSelected()">Delete Selected</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, snakeHead;
        let isPlaying = false, isEditor = false, isPaused = false;
        let hp = 100, gold = 100;
        let selectedObj = null, speedMod = 1;
        let bodySegments = [], snakeHistory = [], monsters = [], traders = [];
        let keys = {}, mouseButtons = {};

        // Initialization
        window.initGame = (mode) => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Ground
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({color: 0x333333}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            snakeHead = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 2), new THREE.MeshStandardMaterial({color: 0x2ecc71}));
            snakeHead.position.y = 0.6;
            scene.add(snakeHead);

            if(mode === 'play') {
                isPlaying = true;
            } else {
                isEditor = true;
                document.getElementById('inspector').style.display = 'block';
                camera.position.set(0, 10, 20);
                scene.add(new THREE.GridHelper(500, 50, 0xffffff, 0x444444));
            }

            animate();
        };

        // Pause Logic
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if(e.key === 'Escape') togglePause();
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        window.togglePause = () => {
            isPaused = !isPaused;
            document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
        };

        // Editor Functions
        window.spawnInEditor = () => {
            const type = document.getElementById('spawn-type').value;
            let mesh;
            if(type === 'block') mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0x555555}));
            if(type === 'apple') mesh = new THREE.Mesh(new THREE.SphereGeometry(0.7), new THREE.MeshStandardMaterial({color: 0xff0000}));
            if(type === 'trader') mesh = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 3), new THREE.MeshStandardMaterial({color: 0xffffff}));
            
            const dir = new THREE.Vector3(0,0,-10).applyQuaternion(camera.quaternion);
            mesh.position.copy(camera.position).add(dir);
            scene.add(mesh);
            if(type === 'trader') traders.push(mesh);
        };

        window.applyTransform = () => {
            if(!selectedObj) return;
            selectedObj.position.set(
                parseFloat(document.getElementById('ix').value),
                parseFloat(document.getElementById('iy').value),
                parseFloat(document.getElementById('iz').value)
            );
        };

        window.deleteSelected = () => { if(selectedObj) { scene.remove(selectedObj); selectedObj = null; } };

        // Mouse Controls
        window.addEventListener('mousedown', (e) => {
            mouseButtons[e.button] = true;
            if(isEditor && e.button === 0) { // Left Click Select
                const ray = new THREE.Raycaster();
                const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
                ray.setFromCamera(mouse, camera);
                const hits = ray.intersectObjects(scene.children);
                if(hits.length > 0 && hits[0].object !== snakeHead) {
                    selectedObj = hits[0].object;
                    document.getElementById('ix').value = selectedObj.position.x;
                    document.getElementById('iy').value = selectedObj.position.y;
                    document.getElementById('iz').value = selectedObj.position.z;
                }
            }
        });
        window.addEventListener('mouseup', (e) => mouseButtons[e.button] = false);

        // Editor Camera Movement (Right Click to Rotate)
        window.addEventListener('mousemove', (e) => {
            if(isEditor && mouseButtons[2]) {
                camera.rotation.y -= e.movementX * 0.003;
                camera.rotation.x -= e.movementY * 0.003;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if(isPaused) return;

            if(isEditor) {
                const fly = keys['shift'] ? 1 : 0.3;
                if(keys['w']) camera.translateZ(-fly);
                if(keys['s']) camera.translateZ(fly);
                if(keys['a']) camera.translateX(-fly);
                if(keys['d']) camera.translateX(fly);
                if(keys['q']) camera.position.y += fly;
                if(keys['e']) camera.position.y -= fly;
            }

            if(isPlaying) {
                // Movement
                let moving = false;
                if(keys['w']) { snakeHead.translateZ(-0.4 * speedMod); moving = true; }
                if(keys['s']) { snakeHead.translateZ(0.2 * speedMod); moving = true; }
                if(keys['a']) { snakeHead.rotation.y += 0.05; moving = true; }
                if(keys['d']) { snakeHead.rotation.y -= 0.05; moving = true; }

                // Snake Tail Logic
                if(moving) {
                    snakeHistory.unshift(new THREE.Vector3().copy(snakeHead.position));
                    if(snakeHistory.length > 300) snakeHistory.pop();
                    bodySegments.forEach((seg, i) => {
                        const idx = (i + 1) * 12;
                        if(snakeHistory[idx]) seg.position.lerp(snakeHistory[idx], 0.15);
                    });
                }

                // Interaction Logic (Mod Trader costs money now)
                traders.forEach(t => {
                    if(snakeHead.position.distanceTo(t.position) < 5) {
                        if(gold >= 50) {
                            gold -= 50;
                            speedMod = 2; // Example power
                            t.material.color.set(0x00ff00); // Visual feedback
                        }
                    }
                });

                const camOffset = new THREE.Vector3(0, 15, 30).applyMatrix4(snakeHead.matrixWorld);
                camera.position.lerp(camOffset, 0.1);
                camera.lookAt(snakeHead.position);
            }

            document.getElementById('gold-txt').innerText = gold;
            renderer.render(scene, camera);
        }

        window.oncontextmenu = (e) => e.preventDefault();
    </script>
</body>
</html>
