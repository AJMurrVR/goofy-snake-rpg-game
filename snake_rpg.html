<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Engine: Professional Creator</title>
    <style>
        :root { --panel: #252525; --border: #111; --accent: #2ecc71; --text: #ddd; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: var(--text); }
        
        /* Main Menu Overlay */
        #main-menu { position: absolute; inset: 0; background: radial-gradient(circle, #2c3e50, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        .menu-card { background: rgba(0,0,0,0.8); padding: 40px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; }

        /* Unity Layout */
        #editor-container { display: grid; grid-template-columns: 200px 1fr 280px; grid-template-rows: 40px 1fr 220px; height: 100vh; width: 100vw; display: none; }
        
        header { grid-column: 1 / 4; background: #333; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border); gap: 10px; }
        #hierarchy { background: var(--panel); border-right: 1px solid var(--border); padding: 10px; font-size: 13px; }
        #inspector { background: var(--panel); border-left: 1px solid var(--border); padding: 15px; font-size: 13px; }
        #viewport { position: relative; background: #111; cursor: crosshair; }
        #project-window { grid-column: 1/4; background: #1e1e1e; border-top: 1px solid var(--border); padding: 15px; display: flex; gap: 20px; }

        /* UI Elements */
        .btn { background: var(--accent); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn:hover { filter: brightness(1.2); }
        .btn-blue { background: #3498db; }
        .folder { width: 70px; text-align: center; cursor: pointer; padding: 5px; border-radius: 5px; }
        .folder:hover { background: #333; }
        input, select { width: 100%; background: #111; border: 1px solid #444; color: white; padding: 5px; margin: 5px 0; }
        
        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; display: none; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="menu-card">
            <h1 style="color: var(--accent); margin-top:0;">SNAKE ENGINE PRO</h1>
            <button class="btn" style="width:200px; margin:10px;" onclick="startEngine('editor')">OPEN EDITOR</button><br>
            <button class="btn btn-blue" style="width:200px; margin:10px;" onclick="startEngine('play')">PLAY MAIN GAME</button>
        </div>
    </div>

    <div id="hud">
        <div style="background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border-left: 5px solid var(--accent);">
            HP: <span id="hp">100</span> | Gold: $<span id="gold">0</span>
        </div>
    </div>

    <div id="editor-container">
        <header>
            <span style="font-weight:bold; color:var(--accent)">EDITOR</span>
            <button class="btn btn-blue" onclick="togglePlayMode()" id="play-btn">▶ PLAY</button>
            <button class="btn" onclick="saveProject()">SAVE</button>
        </header>

        <div id="hierarchy">
            <h4 style="margin:0 0 10px 0">Hierarchy</h4>
            <div id="obj-list"></div>
        </div>

        <div id="viewport"></div>

        <div id="inspector">
            <h4 style="margin:0 0 10px 0">Inspector</h4>
            <div id="ins-content">Select an object in the viewport.</div>
            <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
            <h4>Add Component</h4>
            <select id="biome-spawn">
                <option value="grass">Forest Block</option>
                <option value="sand">Desert Block</option>
                <option value="trader">Mod Trader</option>
            </select>
            <button class="btn" style="width:100%" onclick="spawnObject()">Spawn Object</button>
        </div>

        <div id="project-window">
            <div class="folder" onclick="alert('Textures Folder Empty')">📁<br>Textures</div>
            <div class="folder" onclick="alert('Models Folder Empty')">📁<br>Models</div>
            <div class="folder" onclick="addNewScript()">📄<br>New Script</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let scene, camera, renderer, transformControls, snake;
        let isEditor = false, isPlaying = false;
        let objects = [];
        let snakeHistory = [], bodySegments = [];

        window.startEngine = (mode) => {
            document.getElementById('main-menu').style.display = 'none';
            init(mode);
        };

        function init(mode) {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            const viewport = document.getElementById('viewport');
            camera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);
            camera.lookAt(0,0,0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            viewport.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Gizmos
            transformControls = new TransformControls(camera, renderer.domElement);
            scene.add(transformControls);

            // Snake
            const snakeTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/floors/FloorsCheckerboard_S_Diffuse.jpg');
            snake = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 2), new THREE.MeshStandardMaterial({ map: snakeTex }));
            snake.visible = false;
            scene.add(snake);

            if(mode === 'editor') {
                document.getElementById('editor-container').style.display = 'grid';
                scene.add(new THREE.GridHelper(100, 20, 0x444444, 0x222222));
                isEditor = true;
            } else {
                togglePlayMode(true);
            }

            // Click handling
            renderer.domElement.addEventListener('mousedown', onPointerDown);
            
            animate();
        }

        window.spawnObject = () => {
            const type = document.getElementById('biome-spawn').value;
            let geo = new THREE.BoxGeometry(2,2,2);
            let color = type === 'grass' ? 0x2ecc71 : 0xf1c40f;
            if(type === 'trader') color = 0xffffff;

            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color }));
            mesh.position.set(0, 1, 0);
            mesh.name = type + "_" + objects.length;
            scene.add(mesh);
            objects.push(mesh);
            updateHierarchy();
        };

        function onPointerDown(event) {
            if(isPlaying) return;
            const mouse = new THREE.Vector2();
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                transformControls.attach(obj);
                showInspector(obj);
            }
        }

        function showInspector(obj) {
            const content = document.getElementById('ins-content');
            content.innerHTML = `
                <b>Name:</b> ${obj.name}<br>
                <label>X Position</label><input type="number" value="${obj.position.x.toFixed(2)}" step="0.1" readonly>
                <button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="alert('Script Applied')">Add Logic Script</button>
            `;
        }

        window.togglePlayMode = (direct = false) => {
            isPlaying = !isPlaying;
            const btn = document.getElementById('play-btn');
            const hud = document.getElementById('hud');
            
            if(isPlaying) {
                if(!direct) transformControls.detach();
                snake.visible = true;
                hud.style.display = 'block';
                if(btn) btn.innerText = "■ STOP";
                if(btn) btn.style.background = "#e74c3c";
                camera.position.set(0, 10, 15);
            } else {
                snake.visible = false;
                hud.style.display = 'none';
                if(btn) btn.innerText = "▶ PLAY";
                if(btn) btn.style.background = "#3498db";
            }
        };

        function updateHierarchy() {
            const list = document.getElementById('obj-list');
            list.innerHTML = "";
            objects.forEach(obj => {
                const d = document.createElement('div');
                d.style.padding = "5px";
                d.style.cursor = "pointer";
                d.innerHTML = "📦 " + obj.name;
                d.onclick = () => { transformControls.attach(obj); showInspector(obj); };
                list.appendChild(d);
            });
        }

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function animate() {
            requestAnimationFrame(animate);
            
            if(isPlaying) {
                // Movement
                if(keys['w']) snake.translateZ(-0.2);
                if(keys['s']) snake.translateZ(0.2);
                if(keys['a']) snake.rotation.y += 0.05;
                if(keys['d']) snake.rotation.y -= 0.05;

                // Follow Cam
                const relativeCamOffset = new THREE.Vector3(0, 8, 15);
                const camOffset = relativeCamOffset.applyMatrix4(snake.matrixWorld);
                camera.position.lerp(camOffset, 0.1);
                camera.lookAt(snake.position);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
